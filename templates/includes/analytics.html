{# Head analytics. Disabled automatically while DJANGO_DEBUG=True. #}
{% if analytics_enabled %}
{% if seo_settings.google_analytics_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ seo_settings.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ seo_settings.google_analytics_id }}');
</script>
{% endif %}
{% if seo_settings.google_tag_manager_id %}
<script>
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
  j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','{{ seo_settings.google_tag_manager_id }}');
</script>
{% endif %}
{% endif %}
